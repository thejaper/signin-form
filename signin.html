<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/iconify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fieldFocus {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px 4px rgba(59, 130, 246, 0.2); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .load-animate {
            animation: fadeIn 0.6s ease-out forwards;
        }
        .field-active:focus-within {
            animation: fieldFocus 0.4s ease-out;
        }
        .tab-active {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.15);
            transform: translateY(-2px);
        }
        .glass-btn {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(147, 51, 234, 0.8));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(147, 51, 234, 0.9));
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="load-animate w-full max-w-md mx-4">
        <div class="bg-white/20 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/30 p-8" style="background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(20px);">
            <h2 class="font-poppins text-3xl font-bold text-center mb-8 text-white drop-shadow-lg">Welcome</h2>

            <div class="flex gap-2 mb-8">
                <button onclick="switchTab('signin')" id="tab-signin" class="tab-active flex-1 py-3 rounded-xl font-poppins font-medium text-white transition-all duration-300" style="background: rgba(255, 255, 255, 0.35);">Sign In</button>
                <button onclick="switchTab('create')" id="tab-create" class="flex-1 py-3 rounded-xl font-poppins font-medium text-white/70 hover:text-white transition-all duration-300">Create Account</button>
            </div>

            <form id="signin-form" class="space-y-5" onsubmit="event.preventDefault()">
                <div class="field-active relative">
                    <span class="iconify absolute left-4 top-1/2 -translate-y-1/2 text-white/70" data-icon="mdi:email-outline" data-width="20"></span>
                    <input type="email" placeholder="Email" required class="glass-input font-poppins w-full pl-12 pr-4 py-3 rounded-xl text-white placeholder-white/50 outline-none">
                </div>
                <div class="field-active relative">
                    <span class="iconify absolute left-4 top-1/2 -translate-y-1/2 text-white/70" data-icon="mdi:lock-outline" data-width="20"></span>
                    <input type="password" placeholder="Password" required class="glass-input font-poppins w-full pl-12 pr-4 py-3 rounded-xl text-white placeholder-white/50 outline-none">
                </div>
                <button type="submit" class="glass-btn font-poppins w-full py-3 rounded-xl text-white font-semibold mt-4">Sign In</button>
            </form>

            <form id="create-form" class="space-y-5 hidden" onsubmit="event.preventDefault()">
                <div class="field-active relative">
                    <span class="iconify absolute left-4 top-1/2 -translate-y-1/2 text-white/70" data-icon="mdi:account-outline" data-width="20"></span>
                    <input type="text" placeholder="Full Name" required class="glass-input font-poppins w-full pl-12 pr-4 py-3 rounded-xl text-white placeholder-white/50 outline-none">
                </div>
                <div class="field-active relative">
                    <span class="iconify absolute left-4 top-1/2 -translate-y-1/2 text-white/70" data-icon="mdi:email-outline" data-width="20"></span>
                    <input type="email" placeholder="Email" required class="glass-input font-poppins w-full pl-12 pr-4 py-3 rounded-xl text-white placeholder-white/50 outline-none">
                </div>
                <div class="field-active relative">
                    <span class="iconify absolute left-4 top-1/2 -translate-y-1/2 text-white/70" data-icon="mdi:lock-outline" data-width="20"></span>
                    <input type="password" placeholder="Password" required class="glass-input font-poppins w-full pl-12 pr-4 py-3 rounded-xl text-white placeholder-white/50 outline-none">
                </div>
                <div class="field-active relative">
                    <span class="iconify absolute left-4 top-1/2 -translate-y-1/2 text-white/70" data-icon="mdi:lock-check-outline" data-width="20"></span>
                    <input type="password" placeholder="Confirm Password" required class="glass-input font-poppins w-full pl-12 pr-4 py-3 rounded-xl text-white placeholder-white/50 outline-none">
                </div>
                <button type="submit" class="glass-btn font-poppins w-full py-3 rounded-xl text-white font-semibold mt-4">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const signinForm = document.getElementById('signin-form');
            const createForm = document.getElementById('create-form');
            const tabSignin = document.getElementById('tab-signin');
            const tabCreate = document.getElementById('tab-create');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                createForm.classList.add('hidden');
                tabSignin.classList.add('tab-active');
                tabSignin.classList.remove('text-white/70');
                tabCreate.classList.remove('tab-active');
                tabCreate.classList.add('text-white/70');
            } else {
                signinForm.classList.add('hidden');
                createForm.classList.remove('hidden');
                tabCreate.classList.add('tab-active');
                tabCreate.classList.remove('text-white/70');
                tabSignin.classList.remove('tab-active');
                tabSignin.classList.add('text-white/70');
            }
        }
    </script>
</body>
</html>
