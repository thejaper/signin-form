<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/iconify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fieldFocus {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
            50% { box-shadow: 0 0 12px 2px rgba(59, 130, 246, 0.15); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .load-animate {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .field-active:focus-within {
            animation: fieldFocus 0.3s ease-out;
        }
        .tab-active {
            background: rgba(255, 255, 255, 0.5);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.1);
        }
        .glass-btn {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.7), rgba(147, 51, 234, 0.7));
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(147, 51, 234, 0.8));
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="font-poppins min-h-screen flex items-center justify-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="load-animate w-full max-w-sm mx-4">
        <div class="bg-white/70 backdrop-blur-xl rounded-2xl shadow-xl border border-white/30 p-6" style="background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px);">
            <h2 class="font-poppins text-2xl font-semibold text-center mb-6 text-gray-900">Welcome</h2>

            <div class="flex gap-1 mb-6">
                <button onclick="switchTab('signin')" id="tab-signin" class="tab-active flex-1 py-2 rounded-lg font-poppins text-sm font-medium text-gray-900 transition-all duration-200" style="background: rgba(255, 255, 255, 0.5);">Sign In</button>
                <button onclick="switchTab('create')" id="tab-create" class="flex-1 py-2 rounded-lg font-poppins text-sm font-medium text-gray-500 hover:text-gray-900 transition-all duration-200">Create Account</button>
            </div>

            <form id="signin-form" class="space-y-3" onsubmit="event.preventDefault()">
                <div class="field-active relative">
                    <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" data-icon="mdi:email-outline" data-width="18"></span>
                    <input type="email" placeholder="Email" required class="glass-input font-poppins w-full pl-10 pr-3 py-2.5 rounded-lg text-gray-900 placeholder-gray-400 text-sm outline-none">
                </div>
                <div class="field-active relative">
                    <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" data-icon="mdi:lock-outline" data-width="18"></span>
                    <input type="password" placeholder="Password" required class="glass-input font-poppins w-full pl-10 pr-3 py-2.5 rounded-lg text-gray-900 placeholder-gray-400 text-sm outline-none">
                </div>
                <button type="submit" class="glass-btn font-poppins w-full py-2.5 rounded-lg text-white text-sm font-medium mt-3">Sign In</button>
            </form>

            <form id="create-form" class="space-y-3 hidden" onsubmit="event.preventDefault()">
                <div class="field-active relative">
                    <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" data-icon="mdi:account-outline" data-width="18"></span>
                    <input type="text" placeholder="Full Name" required class="glass-input font-poppins w-full pl-10 pr-3 py-2.5 rounded-lg text-gray-900 placeholder-gray-400 text-sm outline-none">
                </div>
                <div class="field-active relative">
                    <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" data-icon="mdi:email-outline" data-width="18"></span>
                    <input type="email" placeholder="Email" required class="glass-input font-poppins w-full pl-10 pr-3 py-2.5 rounded-lg text-gray-900 placeholder-gray-400 text-sm outline-none">
                </div>
                <div class="field-active relative">
                    <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" data-icon="mdi:lock-outline" data-width="18"></span>
                    <input type="password" placeholder="Password" required class="glass-input font-poppins w-full pl-10 pr-3 py-2.5 rounded-lg text-gray-900 placeholder-gray-400 text-sm outline-none">
                </div>
                <div class="field-active relative">
                    <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" data-icon="mdi:lock-check-outline" data-width="18"></span>
                    <input type="password" placeholder="Confirm Password" required class="glass-input font-poppins w-full pl-10 pr-3 py-2.5 rounded-lg text-gray-900 placeholder-gray-400 text-sm outline-none">
                </div>
                <button type="submit" class="glass-btn font-poppins w-full py-2.5 rounded-lg text-white text-sm font-medium mt-3">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const signinForm = document.getElementById('signin-form');
            const createForm = document.getElementById('create-form');
            const tabSignin = document.getElementById('tab-signin');
            const tabCreate = document.getElementById('tab-create');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                createForm.classList.add('hidden');
                tabSignin.classList.add('tab-active');
                tabSignin.classList.remove('text-gray-500');
                tabSignin.classList.add('text-gray-900');
                tabCreate.classList.remove('tab-active');
                tabCreate.classList.remove('text-gray-900');
                tabCreate.classList.add('text-gray-500');
            } else {
                signinForm.classList.add('hidden');
                createForm.classList.remove('hidden');
                tabCreate.classList.add('tab-active');
                tabCreate.classList.remove('text-gray-500');
                tabCreate.classList.add('text-gray-900');
                tabSignin.classList.remove('tab-active');
                tabSignin.classList.remove('text-gray-900');
                tabSignin.classList.add('text-gray-500');
            }
        }
    </script>
</body>
</html>
